{{ define "main" }}
<section class="page-heading">
  <p class="eyebrow">The archive</p>
  <h1>{{ .Title }}</h1>
  <div class="intro">{{ .Content }}</div>
</section>
<div class="event-grid all-events">
  {{ range .Pages.ByDate.Reverse }}
    {{ partial "event-card.html" . }}
  {{ end }}
</div>
{{ end }}
