<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  {{ if or .IsHome (and .IsSection (eq .Section "events")) (and .IsPage (eq .Section "events")) }}
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ site.Title }}">
  {{ with .Params.cover_image }}
  <meta property="og:image" content="{{ . | absURL }}">
  <meta property="og:image:alt" content="{{ $.Params.cover_alt }}">
  {{ end }}
  {{ end }}
  <link rel="stylesheet" href="{{ "css/archive.css" | relURL }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-name" href="{{ "" | relURL }}">Jenkins Meetup <span>Switzerland</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ "" | relURL }}">Home</a>
        <a href="{{ "events/" | relURL }}">Events</a>
        <a href="https://www.meetup.com/swiss-jenkins-area-meetup/">Meetup ↗</a>
      </nav>
    </div>
  </header>
  <main class="container">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Jenkins Meetup Switzerland · Community archive</p>
      <a href="https://www.meetup.com/swiss-jenkins-area-meetup/">Visit the Meetup group ↗</a>
    </div>
  </footer>
</body>
</html>
