baseURL = 'https://jenkins-meetup-ch.github.io/'
title = 'Jenkins Meetup Switzerland'
defaultContentLanguage = 'en'
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = 'github.com/gohugo-ananke/ananke/v2'

[languages]
  [languages.en]
    locale = 'en'
    contentDir = 'content/en'
    weight = 1

[params]
  description = 'An archive of Jenkins Meetup Switzerland and its in-person events.'

[privacy.youtube]
  privacyEnhanced = true
